# The forge is origin and GitHub is a fast-forward copy with the full history,
# because GitHub Actions build the ghcr images and the release APK that
# Obtainium reads. Nothing is forced, so a commit made on GitHub stops the sync
# until it is pulled into the forge. The sync waits for the attribution
# check and the unit tests.
#
# ci-actions is cloned through $GITHUB_SERVER_URL and its scripts run directly,
# not through `uses:`. That form needs the CI host written out, this file goes
# to GitHub with the history, and the denylist gate refuses the host name.
#
# NO_FORGE_REFS refuses forge issue refs in commit messages: commits sync to
# GitHub, where one names another issue or none. `Closes #N` goes in the PR
# description instead.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# One run per ref. Four pushes to a pull request branch in a row queue four
# builds on a runner with one slot, and only the last of them says anything
# about what is being merged. Pushes to main and tags are never cancelled: the
# attribution job reads the range a push added, so a run skipped there is a
# hole in the record rather than a repeat of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  attribution:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Self-test the pattern
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/attribution/check-attribution.sh" selftest
      - name: Check the commits and the PR description
        env:
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          NO_FORGE_REFS: "true"
        run: GITHUB_ACTION_PATH="${RUNNER_TEMP:-/tmp}/ci-actions/attribution" bash "${RUNNER_TEMP:-/tmp}/ci-actions/attribution/run.sh"

  test:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Offline queue tests
        run: node --test tests/js/*.test.js
      # TypeScript is fetched here and nowhere else: the shipped files stay plain
      # JS with JSDoc. tsc exits non-zero on any error, so the step judges by the
      # baseline in types/tsc-baseline.txt, which only ever comes down.
      - name: Type-check the frontend
        run: |
          out="${RUNNER_TEMP:-/tmp}/tsc.out"
          npx --yes -p typescript@5.9.3 tsc -p . --pretty false > "$out" || true
          python3 scripts/typecheck.py "$out"
      # Cloned like ci-actions, for the same reason. The tag comes from the first
      # line of ui.css, so vendoring a new copy moves the tools in the same commit.
      - name: Fetch ui-foundation
        run: |
          version=$(sed -n '1s/^\/\* ui\.css \([0-9.]*\):.*/\1/p' ui.css)
          git clone -q --depth 1 --branch "v$version" "$GITHUB_SERVER_URL/bjorn/ui-foundation.git" "${RUNNER_TEMP:-/tmp}/ui-foundation"
      # What stays off the scales: hairline and negative offsets, px paired with a
      # fixed box, reserved icon room, and the webview notice, which has to work
      # without ui.css. Lower a limit when a value goes; never raise one.
      - name: Check ui.css copy, host mapping, contrast and scales
        run: |
          tools="${RUNNER_TEMP:-/tmp}/ui-foundation/tools"
          python3 "$tools/vendored_check.py" ui.css --repo "$GITHUB_SERVER_URL/bjorn/ui-foundation.git"
          python3 "$tools/host_check.py" index.html
          python3 "$tools/contrast.py" app/app.css --theme-re '\[data-theme="[^"]+"\]\[data-mode="[^"]+"\]'
          python3 "$tools/css_audit.py" index.html app/app.css --scale ui.css --max font-size=1 --max spacing=19 --max radius=0 --max transition=0 --max z-index=1

  # Reads a PR's commits with the list github-sync applies after the merge, when
  # the only fix for a hit is rewriting protected main. Here it is still a
  # force-push to the PR branch.
  commit-gate:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Self-test commit-gate
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/commit-gate/selftest.sh"
      - name: Gate the PR's commits
        env:
          DENYLIST: ${{ secrets.DEPLOY_DENYLIST }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/commit-gate/commit-gate.sh"

  github-sync:
    if: github.event_name == 'push'
    needs: [attribution, test]
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Self-test checkout
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/selftest.sh"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Push to GitHub
        env:
          DEPLOY_KEY: ${{ secrets.PUBLISH_DEPLOY_KEY }}
          DENYLIST: ${{ secrets.DEPLOY_DENYLIST }}
          REPO: polybjorn/ferd
          REF: ${{ github.ref }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/github-sync/github-sync.sh"
