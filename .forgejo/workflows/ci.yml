# The forge is origin and GitHub is a fast-forward copy with the full history,
# because GitHub Actions build the ghcr images and the release APK that
# Obtainium reads. Nothing is forced, so a commit made on GitHub stops the sync
# until it is pulled into the forge. The sync waits for the attribution and
# prose checks, the unit tests and the browser tests.
#
# ci-actions is cloned through $GITHUB_SERVER_URL and its scripts run directly,
# not through `uses:`. That form needs the CI host written out, this file goes
# to GitHub with the history, and the denylist gate refuses the host name.
#
# NO_FORGE_REFS refuses forge issue refs in commit messages: commits sync to
# GitHub, where one names another issue or none. `Closes #N` goes in the PR
# description instead.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# One run per ref. Four pushes to a pull request branch in a row queue four
# builds on a runner with one slot, and only the last of them says anything
# about what is being merged. Pushes to main and tags are never cancelled: the
# attribution job reads the range a push added, so a run skipped there is a
# hole in the record rather than a repeat of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  attribution:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Self-test the pattern
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/attribution/check-attribution.sh" selftest
      - name: Check the commits and the PR description
        env:
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          NO_FORGE_REFS: "true"
        run: GITHUB_ACTION_PATH="${RUNNER_TEMP:-/tmp}/ci-actions/attribution" bash "${RUNNER_TEMP:-/tmp}/ci-actions/attribution/run.sh"

  prose:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Fetch the prose engine
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/prose/fetch-engine.sh"
      - name: Self-test the engine and the check
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/prose/selftest.sh"
      - name: Check the commits and the PR description
        env:
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: GITHUB_ACTION_PATH="${RUNNER_TEMP:-/tmp}/ci-actions/prose" bash "${RUNNER_TEMP:-/tmp}/ci-actions/prose/run.sh"

  test:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Offline queue tests
        run: node --test tests/js/*.test.js
      # TypeScript is fetched here and nowhere else: the shipped files stay plain
      # JS with JSDoc, checked in full strict mode (tsconfig.json). tsc exits
      # non-zero on any error, so the step judges by the baseline in
      # types/tsc-baseline.txt, which only ever comes down.
      - name: Type-check the frontend
        run: |
          out="${RUNNER_TEMP:-/tmp}/tsc.out"
          npx --yes -p typescript@5.9.3 tsc -p . --pretty false > "$out" || true
          python3 scripts/typecheck.py "$out"
      # Cloned like ci-actions, for the same reason. The tag comes from the first
      # line of ui.css, so vendoring a new copy moves the tools in the same commit.
      - name: Fetch ui-foundation
        run: |
          version=$(sed -n '1s/^\/\* ui\.css \([0-9.]*\):.*/\1/p' ui.css)
          git clone -q --depth 1 --branch "v$version" "$GITHUB_SERVER_URL/bjorn/ui-foundation.git" "${RUNNER_TEMP:-/tmp}/ui-foundation"
      # What stays off the scales: hairline and negative offsets, px paired with a
      # fixed box, reserved icon room, and the webview notice, which has to work
      # without ui.css. The one-off counts are inline style= in the Preact
      # templates, !important in the stylesheets and the colours that are not theme
      # tokens yet. Lower a limit when a value goes; never raise one.
      - name: Check ui.css and ui.js copies, host mapping, contrast, scales and one-offs
        run: |
          python3 "${RUNNER_TEMP:-/tmp}/ui-foundation/tools/app_check.py" \
            --copy ui.css --js-copy ui.js --repo "$GITHUB_SERVER_URL/bjorn/ui-foundation.git" \
            --entry index.html --scripts app/*.js app/*/*.js \
            --contrast-host app/app.css --contrast-theme-re '\[data-theme="[^"]+"\]\[data-mode="[^"]+"\]' \
            --audit-files index.html webview-notice.css app/*.css app/*/*.css \
            --audit-max font-size=1 spacing=18 radius=0 transition=0 z-index=1 \
            --one-off-files index.html app/*.css app/*/*.css app/*.js app/*/*.js \
            --one-off-max inline-style=62 important=70 colour=6

  # The browser tests, on Microsoft's Playwright image, which carries the
  # browsers for one Playwright release only: package.json pins that release,
  # and the runner's image tag moves with it.
  e2e:
    runs-on: playwright
    timeout-minutes: 20
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      # Full history, since the scope step reads the range back to the merge
      # base or the push's before.
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      # A skip leaves the job green rather than skipped, so github-sync, which
      # needs it, still runs.
      - name: Decide whether there is anything to test
        id: scope
        env:
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/e2e-scope.js
      # Offline against the runner's /osv cache, so the package list never
      # reaches osv.dev. It reads the lockfile, so it sits ahead of npm ci.
      - name: Self-test the OSV gate
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/osv-scan/selftest.sh"
      - name: Known vulnerabilities in dependencies
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/osv-scan/scan.sh"
      - run: npm ci
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 5
      - name: Playwright release against the image's browsers
        if: steps.scope.outputs.run == 'true'
        run: npx playwright --version
      - name: Browser tests
        if: steps.scope.outputs.run == 'true'
        env:
          CI: "true"
        run: npx playwright test
      # Zipped because the report is a tree and the upload takes one
      # directory's own files.
      - name: Upload the report and traces
        if: failure()
        run: |
          set -eu
          tools="${RUNNER_TEMP:-/tmp}/ci-actions/upload-artifact"
          bash "$tools/selftest.sh"
          out="${RUNNER_TEMP:-/tmp}/e2e-upload"
          mkdir -p "$out"
          dirs=$(ls -d playwright-report test-results 2>/dev/null || true)
          [ -z "$dirs" ] || python3 -m zipfile -c "$out/e2e-report.zip" $dirs
          python3 "$tools/upload_artifact.py" e2e-report "$out"

  # Reads a PR's commits with the list github-sync applies after the merge, when
  # the only fix for a hit is rewriting protected main. Here it is still a
  # force-push to the PR branch.
  commit-gate:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Self-test commit-gate
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/commit-gate/selftest.sh"
      - name: Gate the PR's commits
        env:
          DENYLIST: ${{ secrets.DEPLOY_DENYLIST }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/commit-gate/commit-gate.sh"

  github-sync:
    if: github.event_name == 'push'
    needs: [attribution, prose, test, e2e]
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Self-test checkout
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/selftest.sh"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Push to GitHub
        env:
          DEPLOY_KEY: ${{ secrets.PUBLISH_DEPLOY_KEY }}
          DENYLIST: ${{ secrets.DEPLOY_DENYLIST }}
          REPO: polybjorn/ferd
          REF: ${{ github.ref }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/github-sync/github-sync.sh"
