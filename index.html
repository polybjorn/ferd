<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferd</title>
  <meta name="description" content="Ferd keeps the places you want to visit and the routes you have walked on one map.">
  <!-- __FERD_SHARE_TAGS__ -->
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="manifest" href="/icons/manifest.webmanifest">
  <meta name="theme-color" content="#6aaeee">
  <!-- The app version, swapped in by the static handler at serve time so the
       frontend knows it without /api/state (local-only mode). Left as the
       placeholder when served without the API. -->
  <meta name="ferd-version" content="__FERD_APP_VERSION__">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ferd">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/app/app.css?v=__FERD_CACHE_VERSION__">
  <link rel="stylesheet" href="/ui.css?v=__FERD_CACHE_VERSION__">
  <script src="/theme-init.js?v=__FERD_CACHE_VERSION__"></script>
  <!-- Firefox ignores an import map that comes after a module preload. -->
  <script type="importmap">
    { "imports": { "preact": "/vendor/preact/preact.js", "preact/hooks": "/vendor/preact/hooks.js", "htm": "/vendor/htm/htm.js", "@preact/signals": "/vendor/signals/signals.js", "@preact/signals-core": "/vendor/signals/signals-core.js" } }
  </script>
  <!-- Without these, each import is found only after its parent arrives. The
       map, Leaflet and the router are left out: app/map/load.js fetches them
       once the viewer is past the sign-in check. -->
  <link rel="modulepreload" href="/app/area-geo.js">
  <link rel="modulepreload" href="/app/auth.js">
  <link rel="modulepreload" href="/app/bottom-bar.js">
  <link rel="modulepreload" href="/app/bar-motion.js">
  <link rel="modulepreload" href="/app/core.js">
  <link rel="modulepreload" href="/app/download.js">
  <link rel="modulepreload" href="/app/gpx-text.js">
  <link rel="modulepreload" href="/app/i18n.js">
  <link rel="modulepreload" href="/app/lazy-open.js">
  <link rel="modulepreload" href="/app/map/load.js">
  <link rel="modulepreload" href="/app/main.js">
  <link rel="modulepreload" href="/app/modal.js">
  <link rel="modulepreload" href="/app/places-list.js">
  <link rel="modulepreload" href="/app/prefs.js">
  <link rel="modulepreload" href="/app/select.js">
  <link rel="modulepreload" href="/app/server.js">
  <link rel="modulepreload" href="/app/sign-in.js">
  <link rel="modulepreload" href="/app/store.js">
  <link rel="modulepreload" href="/app/tags.js">
  <link rel="modulepreload" href="/app/theme.js">
  <link rel="modulepreload" href="/app/view.js">
  <link rel="stylesheet" href="/webview-notice.css?v=__FERD_CACHE_VERSION__">
</head>
<body class="app-booting">
  <a class="ui-button skip-link" href="#app" id="skip-link">Skip to content</a>
  <div id="webview-notice" role="alert" hidden>
    <h1>Update your browser to use Ferd</h1>
    <p>Ferd needs Chrome 99 or a newer browser. On Android, update Android System WebView and Chrome from the Play Store, then reopen Ferd.</p>
  </div>
  <script src="/webview-check.js?v=__FERD_CACHE_VERSION__"></script>
  <nav class="app-nav">
    <h1 class="nav-brand">
      <a href="#/" id="nav-home"><span id="nav-brand-text">Ferd</span></a><span id="nav-crumb"></span>
    </h1>
    <div class="ui-tabs nav-tabs">
      <a class="ui-tab" href="#/places" data-view="places" id="tab-places">Places</a>
      <a class="ui-tab" href="#/routes" data-view="routes" id="tab-routes">Routes</a>
      <a class="ui-tab" href="#/history" data-view="history" id="tab-history">History</a>
    </div>
    <div class="nav-right">
      <div class="nav-actions" id="nav-actions"></div>
      <div class="auth-widget" id="auth-widget"></div>
    </div>
  </nav>
  <div class="pwa-notices">
  <div id="pwa-offline-banner" class="ui-banner ui-banner-warn pwa-banner" role="status" hidden>
    <span id="pwa-offline-text" class="ui-banner-text"></span>
  </div>
  <div id="pwa-sync-issues" class="ui-banner ui-banner-warn pwa-banner" role="alert" hidden>
    <span id="pwa-sync-issues-text" class="ui-banner-text"></span>
    <button id="pwa-sync-issues-btn" type="button" class="ui-button">Review</button>
  </div>
  <div id="pwa-sync-toast" class="ui-toast pwa-toast" role="status" hidden></div>
  <div id="pwa-update-banner" class="ui-toast pwa-toast" role="status" hidden>
    <span id="pwa-update-text"></span>
    <button id="pwa-update-btn" type="button" class="ui-button ui-button-primary">Reload</button>
  </div>
  </div>
  <nav class="ui-bottom-bar bottom-bar" id="bottom-bar" aria-label="Views">
    <a class="ui-bottom-bar-item" href="#/" id="bar-map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg><span>Map</span></a>
    <a class="ui-bottom-bar-item" href="#/lists" id="bar-lists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></svg><span>Lists</span></a>
    <button type="button" class="ui-bottom-bar-item" id="bar-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><span>Search</span></button>
    <button type="button" class="ui-bottom-bar-item" id="bar-add" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>Add</span></button>
    <a class="ui-bottom-bar-item" href="#/you" id="bar-you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 20a6 6 0 0 0-12 0"/><circle cx="12" cy="10" r="4"/><circle cx="12" cy="12" r="10"/></svg><span>You</span></a>
  </nav>
  <main id="app" tabindex="-1"><div class="app-state" aria-busy="true"><p class="ui-hint" role="status">Loading...</p></div></main>
  <div id="modal-root"></div>

  <script src="/ui.js?v=__FERD_CACHE_VERSION__" defer></script>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
