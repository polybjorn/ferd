name: Android build

on:
  # main only: a tag push builds the signed APK in release-apk.yml.
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app/**'
      - 'catalog.json'
      - 'sw.js'
      - 'vendor/**'
      - 'icons/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'index.html'
      - 'app/**'
      - 'catalog.json'
      - 'sw.js'
      - 'vendor/**'
      - 'icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes the debug build of an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # full history so the version task can count commits

      - name: Set up JDK 27
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the debug APK
        id: apk
        run: |
          version="$(cat VERSION)"
          out="ferd-${version}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ferd-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
