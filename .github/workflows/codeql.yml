name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

# Only the newest commit's alerts matter, and the weekly run reads the same
# main as a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Overlay analysis saves a base database to the Actions cache on every push
    # to main, for pull requests to build on. Pull requests are rare on this
    # copy, so nothing read them: 345 of them held 7.3 GB of the 10 GB cache.
    env:
      CODEQL_OVERLAY_DATABASE_MODE: none
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          # Kotlin can't be analyzed in build-mode: none (that mode extracts
          # Java source only). The shell must be compiled under CodeQL's tracer,
          # so this language builds the Android app with JDK + the Android SDK.
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 27
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4.0.4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Neither folder ships: fixtures and demo credentials there read as
          # findings against the app.
          config: |
            paths-ignore:
              - tests
              - .site-sheet

      - name: Build Android app (manual build for CodeQL tracing)
        if: matrix.language == 'java-kotlin'
        working-directory: android
        # --no-build-cache: the cache setup-java restores holds the Android job's
        # compiled classes, and a task taken from it never runs under the tracer,
        # which would leave the Kotlin database empty.
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
