name: Vendor version check

# Runs weekly to flag upstream version bumps for the vendored frontend libs
# under `vendor/` and the pinned dev tools (jscpd, radon) in
# scripts/vendor-versions.json. Opens (or updates) a single tracking issue when
# drift is detected; the issue body is the full report from the check script.
# Closes that issue again once every pin is back in sync. If a registry lookup
# fails the run fails and the issue is left as-is, since "no drift found" after
# a failed lookup would otherwise close a live issue.

on:
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  TRACKER_TITLE: "Pinned versions: upstream bumps available"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run check
        id: check
        run: |
          set +e
          REPORT=$(python3 scripts/check-vendor-versions.py)
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<EOF'
            echo "$REPORT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "$REPORT"
          exit 0

      - name: Find existing tracking issue
        id: tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Exact title match over the open issues rather than a search query:
          # the title contains a colon, which reads as a search qualifier.
          NUMBER=$(gh issue list --state open --limit 100 --json number,title \
            | python3 -c "import sys,json,os; d=json.load(sys.stdin); print(next((i['number'] for i in d if i['title']==os.environ['TRACKER_TITLE']), ''))")
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report }}
          EXISTING: ${{ steps.tracker.outputs.number }}
        run: |
          BODY=$(printf '%s\n\n```\n%s\n```\n\n_Last run: %s_' \
            "Run \`python3 scripts/check-vendor-versions.py\` locally to reproduce. Vendored lib: re-download into \`vendor/\`, update \`scripts/vendor-versions.json\`. Dev tool (jscpd/radon): just update its version in \`scripts/vendor-versions.json\`. The service-worker cache version is content-derived on serve, so never edit the \`CACHE_VERSION\` literal in \`sw.js\`." \
            "$REPORT" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)")

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TRACKER_TITLE" --body "$BODY"
          fi

      - name: Close tracking issue once back in sync
        if: steps.check.outputs.status == '0' && steps.tracker.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING: ${{ steps.tracker.outputs.number }}
        run: |
          gh issue close "$EXISTING" \
            --comment "Every pin is back at its latest upstream version, closing automatically. A fresh issue opens if drift returns."
          echo "Closed issue #$EXISTING"

      - name: Fail when the check could not run
        if: steps.check.outputs.status == '2'
        run: |
          echo "::error::A registry lookup failed, so drift is unknown. Tracking issue left untouched."
          exit 1
