name: docker-publish

# Two tracks share one workflow:
#   - push to main      -> ghcr.io/<owner>/<repo>:dev (+ commit-sha tag)
#   - push of a v* tag  -> :<major>, :<major>.<minor>, :<major>.<minor>.<patch>, :latest
#   - push of a vX.Y.Z-beta.N tag -> :X.Y.Z-beta.N and :beta only, so nobody on
#     :latest or a version line gets a beta
# Pull requests build the image to verify the Dockerfile but don't push.
# A tag push waits for release-gate.yml: the commit is on main, the tests pass
# on it, and a stable tag matches VERSION. Main and PR builds skip the gate.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read

  build-and-push:
    needs: gate
    # A skipped gate (main, PR) lets the build run; a failed one stops it.
    if: ${{ !cancelled() && needs.gate.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # Two quick pushes to main would otherwise race for :dev, and the older
    # build finishing last moves it back a commit.
    concurrency:
      group: docker-publish-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1

      # The e2e and Lighthouse runs test a checkout, and production runs from one,
      # so this is the only place the entrypoint, the PUID/PGID handling and the
      # site-config.json symlink run before a self-hoster pulls the image.
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ferd:smoke
          cache-from: type=gha

      - name: Smoke-test the image
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/smoke-data"
          docker run -d --name ferd-smoke -p 8090:8090 \
            -v "$RUNNER_TEMP/smoke-data:/data" ferd:smoke
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8090/; then
              docker exec ferd-smoke python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/', timeout=3)"
              echo "image serves / and its healthcheck command passes"
              exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' ferd-smoke)" = true ] || break
            sleep 1
          done
          docker logs ferd-smoke
          exit 1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta.') }}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.') }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # A pull request reads the cache but leaves it to main and the tags.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  # After every push, delete the image versions nothing keeps: superseded
  # betas, commit builds past the newest 20, and untagged manifests no kept tag
  # references (scripts/prune-releases.py).
  prune-images:
    needs: build-and-push
    # A skipped gate (main) skips every job below it unless the condition says otherwise.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    concurrency:
      group: prune-images
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Delete superseded images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/prune-releases.py images --keep-commits 20
