name: docker-publish

# Two tracks share one workflow:
#   - push to main      -> ghcr.io/<owner>/<repo>:dev (+ commit-sha tag)
#   - push of a v* tag  -> :<major>, :<major>.<minor>, :<major>.<minor>.<patch>, :latest
#   - push of a vX.Y.Z-beta.N tag -> :X.Y.Z-beta.N and :beta only, so nobody on
#     :latest or a version line gets a beta
# Pull requests build the image to verify the Dockerfile but don't push.
# A tag push waits for release-gate.yml: the commit is on main, the tests pass
# on it, and a stable tag matches VERSION. Main and PR builds skip the gate.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  gate:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read

  build-and-push:
    needs: gate
    # A skipped gate (main, PR) lets the build run; a failed one stops it.
    if: ${{ !cancelled() && needs.gate.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta.') }}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.') }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
