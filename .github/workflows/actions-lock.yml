name: actions-lock

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Fails when actions.lock no longer matches the workflows, or a locked
  # commit no longer verifies upstream.
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
