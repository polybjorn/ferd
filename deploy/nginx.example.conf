# Ferd: nginx server block.
#
# Static files are served directly by nginx from the repo root. /api/* is
# proxied to the Python API on 127.0.0.1:8091. Put TLS, HSTS, gzip, etc. at
# this layer.
#
# Replace /srv/ferd, ferd.example.com, and the cert paths as appropriate.
#
# Include this file from the http block (conf.d/ or sites-enabled/ do), since
# limit_req_zone below is accepted only in http context.

# Rate-limit login attempts at the proxy level. The API also rate-limits
# internally, but defense in depth is cheap.
limit_req_zone $binary_remote_addr zone=ferd_login:10m rate=10r/m;

server {
    listen 80;
    server_name ferd.example.com;
    # Permanent redirect to HTTPS. Drop this block if running plain HTTP
    # on a private network (Tailscale, LAN).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ferd.example.com;

    ssl_certificate     /etc/letsencrypt/live/ferd.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ferd.example.com/privkey.pem;

    # Block size; GPX uploads are capped at 10 MiB by the API. 12 MiB gives
    # headroom for headers without letting a runaway client buffer endlessly.
    client_max_body_size 12m;

    root /srv/ferd;
    index index.html;

    location = /api/login {
        limit_req zone=ferd_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The API writes the page: it sets the Content-Security-Policy and the
    # link-preview tags (docs/configure.md), and answers robots.txt and the
    # sitemap. So send the page at /, /index.html and every /u/ path, the
    # service worker and those two files through it rather than from disk,
    # and do not add a second policy here. Needs static_dir set in
    # tools/config.json.
    location ~ ^/(index\.html|sw\.js|robots\.txt|sitemap\.xml|u/.*)?$ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static site.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The modules import each other by plain URL, so a browser that guesses a
    # lifetime for one can run it against a newer page.
    location /app/ {
        add_header Cache-Control "no-cache";
    }

    # Data files. These are loaded by the static site at runtime.
    # Keep them gitignored; place them next to index.html or symlink to your
    # own store (e.g. a Syncthing folder).
    location = /places.json { default_type application/json; }
    location = /routes.json { default_type application/json; }
    location /gpx/        { default_type application/gpx+xml; }

    # The root holds server files too: the database, its backups and the
    # config under tools/, every user's GPX files under users/ (the API serves
    # them only to their owner or on a published map), unit files and git.
    # Case-insensitive for a root on a case-insensitive file system.
    location ~* ^/(tools|users|deploy|\.git)(/|$) { return 404; }
}
